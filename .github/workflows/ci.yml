name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The Playwright e2e suite (npm run test:e2e) starts Core and the web app from the sibling
      # checkouts (../cliqhub-core, ../cliqhub-frontend) against a local Postgres. This job checks
      # out only this repo, so it runs locally (dev-local), not here.
